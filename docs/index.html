<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pathways — Lord of the Mysteries Rulebook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: #111; color: #eee; }
  header { padding: 14px 20px; background: #000; border-bottom: 2px solid #7A5C00; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; color: #C9A227; }
  .btn { color: #eee; text-decoration: none; border: 1px solid #7A5C00; padding: 6px 12px; border-radius: 4px; font-size: 14px; }
  .btn:hover { background: #7A5C00; }
  .viewer { width: 100%; height: calc(100vh - 60px); border: none; }
  .note { padding: 8px 20px; font-size: 12px; color: #999; }
  .mobile-open {
    display: none;
    margin: 40px auto; padding: 16px 28px; max-width: 320px;
    text-align: center; font-size: 18px; border: 2px solid #7A5C00;
    border-radius: 8px; background: #1a1a1a; color: #C9A227; text-decoration: none;
  }
  @media (max-width: 768px) {
    .viewer { display: none; }
    .mobile-open { display: block; }
  }
</style>
</head>
<body>
  <header>
    <h1>Pathways &mdash; Lord of the Mysteries</h1>
    <a class="btn" id="dl-link" href="rulebook.pdf" download>Download PDF</a>
  </header>

  <iframe class="viewer" id="pdf-frame" src=""></iframe>
  <a class="mobile-open" id="mobile-link" href="#" target="_blank">Tap to open Rulebook</a>

  <div class="note">Always the current version. If it looks out of date, close and reopen this page.</div>

  <script>
    // Cache-bust with the current time so every page load pulls the latest PDF,
    // instead of a stale cached copy from GitHub's CDN or the browser.
    var version = Date.now();
    var freshUrl = "rulebook.pdf?v=" + version;
    document.getElementById("pdf-frame").src = freshUrl;
    document.getElementById("mobile-link").href = freshUrl;
    document.getElementById("dl-link").href = freshUrl;
  </script>
</body>
</html>
